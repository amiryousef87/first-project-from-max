<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAX Login and Sign Up</title>
    <link rel="icon" href="./img/TITANUOM icon.jpg" type="image/x-icon" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      /* --- Color Variables --- */
      :root {
        --primary: #22d3ee; /* Cyan */
        --secondary: #d946ef; /* Purple-pink */
        --text-gray: #6b7280;
        --border-gray: #d1d5db;
        --shadow-dark: rgba(0, 0, 0, 0.05);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue",
          sans-serif;
      }
      body {
        background: linear-gradient(-45deg, #e6e6e6, #f0f0f0, #e4e4e4, #f8f8f8);
        background-size: 400% 400%;
        animation: gradientMove 15s ease infinite;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
        direction: ltr;
      }
      .container {
        width: 100%;
        max-width: 360px;
        background: #fff;
        border-radius: 1rem;
        box-shadow: 0 4px 6px var(--shadow-dark);
        overflow: hidden;
      }
      .content {
        padding: 2rem 1.5rem;
      }
      #title {
        text-align: center;
        font-size: 1.5rem;
        font-weight: bold;
        margin-bottom: 1.5rem;
        color: #111827;
      }
      .form-group {
        margin-bottom: 1rem;
      }
      .form-group label {
        display: block;
        margin-bottom: 0.25rem;
        font-size: 0.875rem;
        color: var(--text-gray);
      }
      .form-control-wrapper {
        position: relative;
        display: flex;
        align-items: center;
      }
      .form-control {
        width: 100%;
        padding: 0.5rem 0 0.5rem 2rem;
        border: none;
        border-bottom: 1px solid var(--border-gray);
        font-size: 1rem;
        background: transparent;
        transition: border-color 0.3s;
      }
      .form-control:focus {
        border-bottom-color: var(--primary);
        outline: none;
      }
      .input-icon {
        position: absolute;
        left: 0;
        color: var(--text-gray);
        font-size: 1rem;
      }
      .password-toggle {
        position: absolute;
        right: 0;
        cursor: pointer;
        color: var(--text-gray);
        font-size: 1rem;
      }
      .password-toggle:hover {
        color: var(--primary);
      }
      .forgot-password {
        display: block;
        text-align: right;
        font-size: 0.875rem;
        color: var(--text-gray);
        text-decoration: none;
        margin-bottom: 1rem;
      }
      .btn {
        width: 100%;
        padding: 0.75rem;
        background: linear-gradient(to right, var(--primary), var(--secondary));
        color: #fff;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        font-weight: 600;
        font-size: 1rem;
        text-transform: uppercase;
        transition: opacity 0.3s;
      }
      .btn:hover {
        opacity: 0.9;
      }
      .or-text {
        text-align: center;
        color: var(--text-gray);
        font-size: 0.875rem;
        margin: 1.5rem 0 0.75rem;
      }
      .social-logins {
        display: flex;
        justify-content: center;
        gap: 1rem;
        margin-bottom: 2rem;
      }
      .social-icon {
        font-size: 30px; /* اندازه ایکون */
        color: #db4437; /* رنگ گوگل */
        text-decoration: none;
        width: 2rem;
        height: 2rem;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1rem;
      }
      .facebook {
        background: #3b5998;
      }
      .twitter {
        background: #1da1f2;
      }
      .google {
        background: #db4437;
      }
      .switch-link {
        display: block;
        text-align: center;
        font-weight: bold;
        color: #111827;
        text-decoration: none;
        font-size: 1rem;
        text-transform: uppercase;
      }
      .alert {
        padding: 1rem;
        border-radius: 0.5rem;
        margin-bottom: 1rem;
        font-size: 0.875rem;
        text-align: center;
      }
      .alert-danger {
        background: #fee2e2;
        color: #b91c1c;
      }
      .alert-success {
        background: #dcfce7;
        color: #15803d;
      }

      /* Hide elements */
      #register-form {
        display: block; /* Default to login */
      }
      #register-socials {
        display: none;
      }
      #login-socials {
        display: flex;
        justify-content: center; /* وسط چین افقی */
        align-items: center; /* وسط چین عمودی، اگر ارتفاع مشخصی دارد */
        margin-top: 20px; /* اختیاری برای فاصله از بالا */
      }

      /* Mobile responsiveness */
      @media (max-width: 500px) {
        .container {
          border-radius: 0;
        }
        .content {
          padding: 1.5rem 1rem;
        }
      }

      @keyframes gradientMove {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      {% with messages = get_flashed_messages(with_categories=true) %} {% if
      messages %} {% for category, message in messages %}
      <div class="alert alert-{{ category }}">{{ message }}</div>
      {% endfor %} {% endif %} {% endwith %}

      <div id="auth-section">
        <div class="content">
          <h1 id="title">Login</h1>

          <div id="login-form">
            <form method="POST" action="{{ url_for('login') }}">
              <div class="form-group">
                <label for="login-username">Username</label>
                <div class="form-control-wrapper">
                  <input
                    type="text"
                    id="login-username"
                    name="username"
                    class="form-control"
                    required
                    placeholder="Type your username"
                  />
                  <i class="fas fa-user input-icon"></i>
                </div>
              </div>
              <div class="form-group">
                <label for="login-password">Password</label>
                <div class="form-control-wrapper">
                  <input
                    type="password"
                    id="login-password"
                    name="password"
                    class="form-control"
                    required
                    placeholder="Type your password"
                  />
                  <i class="fas fa-lock input-icon"></i>
                  <i
                    class="fas fa-eye-slash password-toggle"
                    onclick="togglePasswordVisibility('login-password', this)"
                  ></i>
                </div>
              </div>
              <a href="{{ url_for('reset_pass') }}" class="forgot-password"
                >Forgot password?</a
              >
              <button class="btn" type="submit">Login</button>
            </form>
            <p class="or-text">Or Log In Using</p>
            <div class="social-logins" id="login-socials">
              <a href="{{ google_login_url }}">
                <i class="fab fa-google"></i>
              </a>
            </div>

            <a onclick="switchTab('register')" class="switch-link">Sign Up</a>
          </div>

          <div id="register-form" style="display: none">
            <form method="POST" action="{{ url_for('register') }}">
              <div class="form-group">
                <label for="register-family">Full Name</label>
                <div class="form-control-wrapper">
                  <input
                    type="text"
                    id="register-family"
                    name="family_name"
                    class="form-control"
                    required
                    placeholder="e.g., John Smith"
                  />
                  <i class="fas fa-id-badge input-icon"></i>
                </div>
              </div>
              <div class="form-group">
                <label for="register-phone">Phone Number</label>
                <div class="form-control-wrapper">
                  <input
                    type="text"
                    id="register-phone"
                    name="phone"
                    class="form-control"
                    required
                    placeholder="(555) 123-4567"
                  />
                  <i class="fas fa-phone input-icon"></i>
                </div>
              </div>
              <div class="form-group">
                <label for="register-username">Username</label>
                <div class="form-control-wrapper">
                  <input
                    type="text"
                    id="register-username"
                    name="username"
                    class="form-control"
                    required
                    placeholder="Choose a username"
                  />
                  <i class="fas fa-user input-icon"></i>
                </div>
              </div>
              <div class="form-group">
                <label for="register-password">Password</label>
                <div class="form-control-wrapper">
                  <input
                    type="password"
                    id="register-password"
                    name="password"
                    class="form-control"
                    required
                    placeholder="Minimum 8 characters"
                  />
                  <i class="fas fa-lock input-icon"></i>
                  <i
                    class="fas fa-eye-slash password-toggle"
                    onclick="togglePasswordVisibility('register-password', this)"
                  ></i>
                </div>
              </div>
              <div class="form-group">
                <label for="register-email">Email</label>
                <div class="form-control-wrapper">
                  <input
                    type="email"
                    id="register-email"
                    name="email"
                    class="form-control"
                    required
                    placeholder="example@domain.com"
                  />
                  <i class="fas fa-envelope input-icon"></i>
                </div>
              </div>
              <button class="btn" type="submit">Sign Up</button>
            </form>
            <p class="or-text">Or Log In</p>
            <a onclick="switchTab('login')" class="switch-link">Log In</a>
          </div>
        </div>
      </div>
    </div>

    <script>
      function switchTab(tab) {
        const loginForm = document.getElementById("login-form");
        const registerForm = document.getElementById("register-form");
        const title = document.getElementById("title");
        const loginSocials = document.getElementById("login-socials");

        if (tab === "login") {
          title.textContent = "Login";
          loginForm.style.display = "block";
          registerForm.style.display = "none";
          if (loginSocials) loginSocials.style.display = "flex";
        } else {
          title.textContent = "Sign Up";
          loginForm.style.display = "none";
          registerForm.style.display = "block";
          if (loginSocials) loginSocials.style.display = "none";
        }
      }

      function togglePasswordVisibility(id, icon) {
        const input = document.getElementById(id);
        if (input.type === "password") {
          input.type = "text";
          icon.classList.remove("fa-eye-slash");
          icon.classList.add("fa-eye");
        } else {
          input.type = "password";
          icon.classList.remove("fa-eye");
          icon.classList.add("fa-eye-slash");
        }
      }
    </script>
  </body>
</html>
