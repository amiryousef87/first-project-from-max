<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Set New Password</title>
    <style>
      /* Modern Style */
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f0f4f8;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        color: #333;
      }

      .container {
        background-color: #ffffff;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        max-width: 400px;
        width: 100%;
        text-align: center;
      }

      h2 {
        font-size: 24px;
        margin-bottom: 30px;
        color: #2c3e50;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      input[type="password"] {
        padding: 12px 15px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 16px;
        transition: border-color 0.3s ease;
      }

      input[type="password"]:focus {
        border-color: #3498db;
        outline: none;
      }

      button[type="submit"] {
        padding: 12px;
        background-color: #3498db;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }

      button[type="submit"]:hover {
        background-color: #2980b9;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Set New Password for {{ email }}</h2>
      <form method="POST">
        <input
          type="password"
          name="password"
          placeholder="New Password"
          required
        />
        <button type="submit">Update Password</button>
      </form>
    </div>
  </body>
</html>
